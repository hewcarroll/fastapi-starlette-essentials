[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-starlette-essentials"
version = "0.1.0"
description = "Production-ready, framework-light building blocks for FastAPI/Starlette apps: security headers, error handlers, request logging, pagination, JWT, async Redis cache, rate limiting, and Prometheus metrics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Hew Carroll" }]
keywords = ["fastapi", "starlette", "middleware", "jwt", "redis", "rate-limit", "prometheus"]
classifiers = [
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = ["fastapi>=0.110"]

[project.optional-dependencies]
jwt = ["python-jose[cryptography]>=3.3"]
redis = ["redis>=4.4"]
ratelimit = ["slowapi>=0.1.9"]
metrics = ["prometheus-client>=0.19"]
all = [
    "python-jose[cryptography]>=3.3",
    "redis>=4.4",
    "slowapi>=0.1.9",
    "prometheus-client>=0.19",
]
dev = [
    "python-jose[cryptography]>=3.3",
    "redis>=4.4",
    "slowapi>=0.1.9",
    "prometheus-client>=0.19",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fakeredis>=2.20",
]

[project.urls]
Homepage = "https://github.com/hewcarroll/fastapi-starlette-essentials"
Repository = "https://github.com/hewcarroll/fastapi-starlette-essentials"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_starlette_essentials"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]